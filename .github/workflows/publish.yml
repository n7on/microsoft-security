name: Publish to PowerShell Gallery

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without v prefix, e.g. 0.1.0)'
        required: false
        type: string
      dryRun:
        description: 'Validate and pack, but do not push to the Gallery'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event.inputs.version }}') {
            '${{ github.event.inputs.version }}'
          } else {
            '${{ github.ref_name }}' -replace '^v', ''
          }

          # A malformed version reaches the Gallery as a permanent, unlistable release,
          # so it is rejected here rather than there.
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?(-[A-Za-z0-9.]+)?$') {
            throw "Version '$version' is not a valid module version."
          }

          "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing version $version"

      - name: Sync manifest version
        shell: pwsh
        run: |
          $path = 'msec/msec.psd1'
          $current = (Import-PowerShellDataFile $path).ModuleVersion
          $target  = '${{ steps.version.outputs.VERSION }}'

          if ($current -ne $target) {
            # Not an error: the release flow allows tagging without a manifest bump. But
            # it means the committed manifest does not describe what was published, so it
            # is called out rather than patched quietly.
            Write-Warning "Manifest says $current but the tag says $target. Patching for this build only - commit the bump so the repo matches the Gallery."
            $raw = Get-Content $path -Raw
            $raw = $raw -replace "ModuleVersion\s*=\s*'[^']*'", "ModuleVersion     = '$target'"
            Set-Content -Path $path -Value $raw -NoNewline
          }

          (Import-PowerShellDataFile $path).ModuleVersion | Write-Host

      - name: Install dependencies
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Set-PSRepository PSGallery -InstallationPolicy Trusted

          # Publish-Module (PowerShellGet 2.x) packs through the NuGet package provider. If
          # it is not present it PROMPTS to install it, and a prompt in a non-interactive
          # runner is a hang or a failure rather than a question. Bootstrapping it here is
          # idempotent and turns an unclear stall into a step that either works or says why.
          if (-not (Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null
          }
          "NuGet provider: $((Get-PackageProvider -Name NuGet).Version)"

          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.0')) {
            Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 5.0
          }
          # All five RequiredModules here, not just the four the tests mock:
          # Publish-Module validates the manifest, which means resolving every entry in
          # RequiredModules - including Az.KeyVault, which no test needs.
          foreach ($m in 'Az.Accounts', 'Az.KeyVault', 'Az.Compute', 'Az.ResourceGraph', 'Az.OperationalInsights') {
            if (-not (Get-Module -ListAvailable $m)) { Install-Module $m -Scope CurrentUser -Force }
          }

      - name: Run tests
        shell: pwsh
        # Step level - the `runner` context does not exist in jobs.<id>.env. See ci.yml.
        env:
          MSEC_CACHE_DIR: ${{ runner.temp }}/msec-cache
        run: |
          $result = Invoke-Pester -Path ./msec/Tests -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) test(s) failed - refusing to publish."
          }

      - name: Validate the module
        shell: pwsh
        run: |
          # Catches manifest problems before they become a published version. A release on
          # the Gallery cannot be replaced, only superseded, so this is the last cheap
          # place to fail.
          Test-ModuleManifest ./msec/msec.psd1 | Format-List Name, Version, RequiredModules

          Import-Module ./msec/msec.psd1 -Force
          $manifest = Import-PowerShellDataFile ./msec/msec.psd1
          $exported = (Get-Module msec).ExportedFunctions.Keys

          $missing = $manifest.FunctionsToExport | Where-Object { $_ -notin $exported }
          if ($missing) { throw "Manifest exports commands that do not exist: $($missing -join ', ')" }

          Write-Host "$(@($exported).Count) commands exported."

      - name: Publish to PowerShell Gallery
        if: ${{ github.event.inputs.dryRun != 'true' }}
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) {
            throw "PSGALLERY_API_KEY secret is not set."
          }
          Publish-Module -Path ./msec -NuGetApiKey $env:PSGALLERY_API_KEY -Repository PSGallery -Verbose

      - name: Dry run - validate only
        if: ${{ github.event.inputs.dryRun == 'true' }}
        shell: pwsh
        run: |
          Publish-Module -Path ./msec -NuGetApiKey 'dry-run' -Repository PSGallery -WhatIf -Verbose
          Write-Host 'Dry run complete - nothing was pushed.'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event.inputs.dryRun != 'true' }}
        with:
          generate_release_notes: true
